# Web IDOR 审计提示词模板
# 合规提示：本文件统一使用防御合规视角措辞（静态数据流可达性分析、
# 权限修饰符一致性核对），零攻击敏感词。

web_idor_audit:
  scenario_question: |
    该函数是否接收客户端可控的资源主键（如 order_id、account_id），
    并执行数据库读取、修改或删除操作？
  property_question: |
    在执行数据库查询条件或前置校验中，是否显式比对了该资源的归属人字段
    （如 user_id、owner_id）与当前登录会话身份（如 current_user.id）？
  skeptic_review: |
    请作为反方质检员，排查以下可推翻上述结论的因素：
    全局网关鉴权、框架级注解、前置状态锁、装饰器级权限检查。
    若任何一项已覆盖资源归属校验，则判定为误报。
