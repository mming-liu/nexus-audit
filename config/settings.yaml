# nexus-audit 配置：OpenCode Go 两级模型漏斗
# Tier-1 初筛：免费模型（longcat-2.5-preview-free / beam-free）
tier1:
  base_url: ${LLM_TIER1_BASE_URL}   # https://opencode.ai/zen/go/v1
  model: beam-free
  api_key: ${LLM_TIER1_API_KEY}
  max_concurrency: 8
  temperature: 0.0

# Tier-2 深度复核：付费 flash（glm-5.3-flash 优先，deepseek-v4.1-flash 兜底）
tier2:
  base_url: ${LLM_TIER2_BASE_URL}   # https://opencode.ai/zen/go/v1
  model: glm-5.3-flash
  api_key: ${LLM_TIER2_API_KEY}
  max_concurrency: 2
  temperature: 0.2

# 跨文件上下文扩展循环
context_loop:
  max_rounds: 3                     # 最多 3 轮按需索取
  max_context_tokens: 60000

# 沙箱自愈
sandbox:
  max_retries: 3                    # 编译报错自愈最多 3 轮
  web_verify_timeout: 120
  foundry_fork_url: ""              # Anvil 分叉链 RPC（留空则本地测试）

# 目标语言
languages: ["python_web", "java_web", "solidity_web3"]
